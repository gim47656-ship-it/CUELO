[package]
name = "cuelo-upkeep-reader"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reads session JSONL for the upkeep scan and keeps only the fields lib/upkeep/sessions.ts uses."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
memchr = "2"
napi = "3"
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
