name: CI

# Both live PCs run CUELO under WSL (Linux), and CI runs no Windows jobs: Linux carries the
# checks. `verify-linux` (install, typecheck, lint, app and sidecar tests, production build,
# web runtime compatibility) and `harness-linux` (two runners side by side: the extension,
# guard and finalizer tests, and the core patch tests including the user-shell PTY path,
# which run several files at once). Public jobs run only on the public mirror, where Actions
# minutes are free. `scope` runs only for `main` pushes and decides whether the app jobs run:
# they are skipped only when every path differing from the last revision whose app job
# passed is a known regular docs or harness-instruction file (see
# .github/scripts/ci-scope.mjs). Pull requests, manual runs, anything unknown and any
# classifier problem run everything. `harness-linux` always runs. `upkeep-reader` builds,
# loads and reads with native/upkeep-reader on the Linux and macOS targets the release
# ships, under the same scope as the app jobs.
#
# CUELO-private is billed per minute. Its `private` job runs on Linux for every
# `main` push except one that touches only files that job cannot read (`paths-ignore`
# below: work records, handoff and setup notes, memory exports) and checks the files the
# mirror does not carry: the setup source manifest, policy and generated agents, eval
# analyzers, setup helpers and the WSL deploy tooling. The mirror runs this same file and
# has none of the ignored paths, so its pushes always start CI.
on:
  pull_request:
  push:
    branches:
      - main
    # A push whose changed files ALL match is skipped; one other file starts the run, and
    # so does a change to this file. Keep every pattern limited to paths that neither the
    # mirror receives nor the private job reads: the source manifest lists every tracked
    # file outside doc/, the repository-only names and the unpackaged parts of Tools/.
    # .github/scripts/ci-paths.test.mjs checks the lists against .publicignore and the manifest.
    paths-ignore:
      - "doc/**"
      - "Tools/*/doc/**"
      - "HANDOFF.md"
      - "PC-SETUP.md"
      - "Tools/*/*.md"
      - "Tools/OMP_Global_Config/memory-sync/memories.jsonl"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # engines.bun requires >=1.4.4: the omp SDK ships TypeScript that imports `bun:`
  # builtins, and Bun 1.4 changed loopback proxy handling.
  BUN_VERSION: "1.4.4"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scope:
    name: Select app jobs
    if: github.repository == 'gim47656-ship-it/CUELO' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Last resort only: the selector bounds itself to 20 s, and a scope job that
    # fails or times out leaves the app jobs running.
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.scope.outputs.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The selector decides what is skipped, so its own tests gate it: a failure here
      # leaves the app jobs running (see their `if`) and turns this run red.
      - name: Selector tests
        run: node --test .github/scripts/ci-scope.test.mjs

      - name: Select app jobs
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-scope.mjs

  verify-linux:
    name: Verify build (Linux)
    needs: scope
    if: >-
      !cancelled() && github.repository == 'gim47656-ship-it/CUELO' &&
      (github.event_name != 'push' || needs.scope.result != 'success' || needs.scope.outputs.app != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The pristine SDK cannot be imported by typecheck, tests or the build; apply
      # its core patches to this checkout's own node_modules first.
      - name: Prepare source SDK
        run: bun run prepare:source

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # Sidecars against the real SDK: side chat, subagent archive and usage.
      - name: Sidecar tests
        run: bun test ./Tools/CUELO_Setup/files/btw-server.test.mjs ./Tools/CUELO_Setup/files/subagent-server.test.mjs ./Tools/CUELO_Setup/files/usage-server.test.js

      - name: Build package
        run: bun run build

      - name: Apply and verify web runtime compatibility
        run: |
          node Tools/CUELO_Setup/files/native-runtime-patch.js --target .
          node Tools/CUELO_Setup/files/native-runtime-patch.js --target . --check
          OMP_CORE_PATCH_TARGET="$PWD/node_modules/@oh-my-pi/pi-coding-agent" bun run Tools/CUELO_Setup/files/native-runtime-behavior-test.ts

  upkeep-reader:
    name: Upkeep reader (${{ matrix.target }})
    needs: scope
    if: >-
      !cancelled() && github.repository == 'gim47656-ship-it/CUELO' &&
      (github.event_name != 'push' || needs.scope.result != 'success' || needs.scope.outputs.app != 'false')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: darwin-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Same toolchain and steps as the release's `native` job.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.99.1" >> "$GITHUB_ENV"

      # Linux links with zig against glibc 2.17, the floor of the SDK's own native binaries; a plain
      # cargo build would require the runner's glibc. Both archives are checked against pinned digests.
      - name: Install the pinned Linux linker (zig, cargo-zigbuild)
        if: runner.os == 'Linux'
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64; zig_sha=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a; czb_sha=32581c8e13f27a807bb244aaaac870522f5b51263c766cf77b1a99771ce9fa5c ;;
            aarch64) arch=aarch64; zig_sha=a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795; czb_sha=70bb4c9cc71a6d16211b9079996e3cd588671053312adeff4d043499ed887601 ;;
          esac
          tools="$RUNNER_TEMP/zig-tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/zig.tar.xz" "https://ziglang.org/download/0.17.1/zig-$arch-linux-0.17.1.tar.xz"
          curl -fsSL -o "$tools/czb.tar.xz" "https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.24.1/cargo-zigbuild-$arch-unknown-linux-gnu.tar.xz"
          printf '%s  %s\n' "$zig_sha" "$tools/zig.tar.xz" "$czb_sha" "$tools/czb.tar.xz" | sha256sum -c -
          tar -xJf "$tools/zig.tar.xz" -C "$tools"
          tar -xJf "$tools/czb.tar.xz" -C "$tools"
          echo "$tools/zig-$arch-linux-0.17.1" >> "$GITHUB_PATH"
          echo "$tools/cargo-zigbuild-$arch-unknown-linux-gnu" >> "$GITHUB_PATH"
          echo "UPKEEP_BUILD_ARGS=--glibc 2.17" >> "$GITHUB_ENV"

      - name: Build, load and read with the upkeep reader
        env:
          TARGET: ${{ matrix.target }}
        run: |
          out="$RUNNER_TEMP/upkeep-reader"
          # shellcheck disable=SC2086 # UPKEEP_BUILD_ARGS is empty or two words
          node bin/prepare-upkeep-reader.js --build --out "$out" $UPKEEP_BUILD_ARGS
          if [ "$RUNNER_OS" = Linux ]; then
            newest=$(objdump -T "$out/$TARGET.node" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "Newest glibc symbol version: $newest"
            [ "$(printf '%s\n' "$newest" GLIBC_2.17 | sort -V | tail -1)" = GLIBC_2.17 ] || { echo "requires $newest, above glibc 2.17"; exit 1; }
          fi
          node bin/prepare-upkeep-reader.js --check --out "$out" --target "$TARGET"
          node -e '
            const fs = require("node:fs");
            const file = require("node:path").join(process.env.RUNNER_TEMP, "upkeep-smoke.jsonl");
            fs.writeFileSync(file, JSON.stringify({ type: "session", id: "s1", extra: 1 }) + "\n");
            const reader = new (require(process.argv[1]).UpkeepReader)(file);
            reader.next().then((batch) => {
              reader.close();
              if (JSON.stringify(JSON.parse(batch)) !== "[{\"type\":\"session\",\"id\":\"s1\"}]") throw new Error(`unexpected batch ${batch}`);
            });
          ' "$out/$TARGET.node"

  harness-linux:
    name: Verify harness (Linux, ${{ matrix.suite }})
    if: github.repository == 'gim47656-ship-it/CUELO'
    runs-on: ubuntu-latest
    # The two suites share the same setup and run on separate runners, so the job's wall
    # time is the slower suite, not their sum.
    strategy:
      fail-fast: false
      matrix:
        suite: [extensions, core]
    defaults:
      run:
        shell: bash
        working-directory: Tools/OMP_Global_Config
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      # Extension tests import the repository SDK as well as the patched copy below,
      # and the pristine SDK cannot be imported (ratchet/prelude.js), so patch it first.
      - name: Prepare source SDK
        working-directory: .
        run: bun run prepare:source

      # A fresh copy of the core version the app pins, patched in RUNNER_TEMP so the
      # core regression tests target a separately installed copy. Core and extension
      # tests read it through OMP_CORE_PATCH_TARGET.
      - name: Prepare patched core
        run: |
          version=$(node -p "require('../../package.json').dependencies['@oh-my-pi/pi-coding-agent']")
          core="$RUNNER_TEMP/core"
          mkdir -p "$core"
          echo '{"name":"ci-core","private":true}' > "$core/package.json"
          (cd "$core" && bun add "@oh-my-pi/pi-coding-agent@$version")
          export OMP_CORE_PATCH_TARGET="$core/node_modules/@oh-my-pi/pi-coding-agent"
          node patches/apply-core-patch.mjs
          echo "OMP_CORE_PATCH_TARGET=$OMP_CORE_PATCH_TARGET" >> "$GITHUB_ENV"

      # Without bash the PTY check skips itself; the PTY itself comes from the
      # platform native package, and the finalizer tests run pwsh.
      - name: Check PTY and finalizer prerequisites
        run: |
          command -v bash
          command -v pwsh
          test -d "$RUNNER_TEMP/core/node_modules/@oh-my-pi/pi-natives-linux-x64" || { echo "pi-natives-linux-x64 is missing"; exit 1; }

      - name: Extension duplicate declarations
        if: matrix.suite == 'extensions'
        run: node patches/check-extension-duplicates.mjs

      - name: Extension, guard, finalizer, vm-build and skill-cost tests
        if: matrix.suite == 'extensions'
        run: bun test ./agent/extensions/tests ./agent/extensions/command-guard ./agent/tools/git-finalizer ./agent/tools/windows-control ./agent/tools/artifact-search ./agent/tools/vm-build ./skill-cost

      # Every file is its own process with its own temporary HOME/roots, so the files run
      # side by side (one per CPU); each log is printed whole, in file order, afterwards.
      - name: Core patch regression tests
        if: matrix.suite == 'core'
        run: |
          tests=(patches/core-*-test.ts patches/apply-core-patch-cli-test.ts)
          # A worker killed before it writes its exit code makes xargs fail. Keep going so the
          # loop below still prints every log and names that file as having no exit code.
          printf '%s\0' "${tests[@]}" | xargs -0 -P "$(nproc)" -I{} bash -c \
            'name=$(basename "$1"); bun run "$1" >"$RUNNER_TEMP/$name.log" 2>&1; echo $? >"$RUNNER_TEMP/$name.code"' _ {} \
            || echo "xargs exited $?; checking every file below"
          failed=()
          for test in "${tests[@]}"; do
            name=$(basename "$test")
            echo "::group::$name"
            cat "$RUNNER_TEMP/$name.log" 2>/dev/null || echo "(no log)"
            echo "::endgroup::"
            code=$(cat "$RUNNER_TEMP/$name.code" 2>/dev/null || echo "no exit code")
            [ "$code" = 0 ] || failed+=("$name (exit $code)")
          done
          # The user-shell PTY check must have run and passed here, not been skipped.
          grep -q "PASS  사용자 셸 PTY" "$RUNNER_TEMP/core-patch-test.ts.log" || failed+=("user-shell PTY check did not run")
          [ ${#failed[@]} -eq 0 ] || { echo "Failed: ${failed[*]}"; exit 1; }

  # The mirror has no agent/config.yml, models.yml, evals/, setup source manifest,
  # setup helpers or WSL deploy tooling.
  private:
    name: Verify private files (Linux)
    if: >-
      github.repository == 'gim47656-ship-it/CUELO-private' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      # doc/ holds about 500 MiB of work records that no step reads: the source manifest
      # lists only git-tracked files outside doc/ and Tools/*/doc/, and no test opens them.
      # Skip them in the working tree and, with the blob filter, in the download.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/doc/
            !/Tools/CUELO_Setup/doc/
            !/Tools/OMP_Global_Config/doc/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The setup transaction refuses to install when the app source differs from
      # files/source-integrity.json (git-tracked files, hashed with LF line endings).
      - name: Setup source manifest
        working-directory: Tools/CUELO_Setup
        run: node files/source-build-helper.js verify-source ../.. files/source-integrity.json files/runtime-integrity.json

      - name: Policy and generated agents
        working-directory: Tools/OMP_Global_Config
        run: |
          node patches/validate-harness-policy.mjs
          node patches/build-agents.mjs --check

      # The analyzers read only evals/, agent/ and patches/ under Tools/OMP_Global_Config, so
      # a push that changed none of them since the last verified revision skips the step
      # (see .github/scripts/ci-eval-scope.mjs); every doubt and every manual run runs it.
      - name: Select eval analyzer tests
        id: eval-scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-eval-scope.mjs

      # `bun test ./evals` would also pick up the graders' hidden task tests.
      - name: Eval analyzer tests
        if: steps.eval-scope.outputs.run != 'false'
        working-directory: Tools/OMP_Global_Config
        run: node --test evals/*.test.mjs

      - name: Setup helper tests
        working-directory: Tools/CUELO_Setup
        run: node --test files/source-build-helper.test.js files/native-runtime-patch.test.js files/set-release-version.test.js

      # The push path filters above decide which pushes start CI and the mirror publish.
      # ci-paths.test.mjs keeps them from ignoring a file the mirror receives or this job
      # reads; it needs .publicignore, so it can only run here. ci-eval-scope.test.mjs covers
      # the eval-step selector.
      - name: Push path filter tests
        run: |
          node --test .github/scripts/ci-eval-scope.test.mjs
          bun test ./.github/scripts/ci-paths.test.mjs ./.github/scripts/paths-filter.test.ts

      # The WSL deploy tooling imports app modules (lib/update-maintenance.ts), so it
      # needs the installed dependencies.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # run-service.sh runs the WSL install's /usr/bin/node by absolute path; the
      # runner's Node comes from setup-node elsewhere, so point that path at it.
      - name: WSL deploy tooling tests
        working-directory: Tools/CUELO_Setup
        run: |
          sudo ln -sf "$(command -v node)" /usr/bin/node
          bun test ./wsl/migrate-profile.test.mjs ./wsl/run-service.test.mjs ./wsl/update-state.test.mjs ./wsl/update.test.mjs ./wsl/windows-bridge/bridge.test.mjs ./wsl/windows-bridge/profile.test.mjs
