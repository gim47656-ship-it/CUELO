name: CI

# Verifies that the app installs from the committed bun.lock, type-checks, lints,
# passes its tests and builds. `bun run test` covers the app only; the `harness`
# job checks the private Tools/OMP_Global_Config harness and runs only in the
# private repository, because the public mirror does not carry its config or evals.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    # CUELO runs on Windows PCs, and several tests (run X-Ray session paths)
    # assume Windows paths.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # engines.bun requires >=1.4.2: the omp SDK ships TypeScript that
          # imports `bun:` builtins, and Bun 1.4 changed loopback proxy handling.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # Same as Tools/CUELO_Setup's build: an isolated home, because the build
      # otherwise walks the real profile and fails on protected folders (EPERM).
      - name: Build package
        shell: pwsh
        run: |
          $buildHome = Join-Path $env:RUNNER_TEMP 'build-home'
          New-Item -ItemType Directory -Path $buildHome -Force | Out-Null
          $root = [IO.Path]::GetPathRoot($buildHome)
          $env:USERPROFILE = $buildHome
          $env:HOME = $buildHome
          $env:HOMEDRIVE = $root.TrimEnd('\')
          $env:HOMEPATH = $buildHome.Substring($root.Length - 1)
          $env:NEXT_TELEMETRY_DISABLED = '1'
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply and verify web runtime compatibility
        shell: pwsh
        run: |
          node Tools/CUELO_Setup/files/native-runtime-patch.js --target .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node Tools/CUELO_Setup/files/native-runtime-patch.js --target . --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OMP_CORE_PATCH_TARGET = Join-Path $PWD 'node_modules/@oh-my-pi/pi-coding-agent'
          bun run Tools/CUELO_Setup/files/native-runtime-behavior-test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  harness:
    name: Verify harness
    if: github.repository == 'gim47656-ship-it/CUELO-private'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Tools/OMP_Global_Config
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The runner's default TEMP is an 8.3 path (RUNNER~1). command-guard treats
      # any `~` in a `git -C` target as shell expansion and blocks it, which breaks
      # its repository-matching fixture. RUNNER_TEMP is a long path.
      - name: Use long-path TEMP
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The setup transaction refuses to install when the app source differs from
      # files/source-integrity.json (git-tracked files, hashed with LF line endings).
      - name: Setup source manifest
        working-directory: Tools/CUELO_Setup
        run: |
          node files/source-build-helper.js verify-source ../.. files/source-integrity.json files/runtime-integrity.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      # A fresh copy of the core version the app pins, patched in RUNNER_TEMP so
      # the repository's node_modules stay unpatched. Core and extension tests
      # read it through OMP_CORE_PATCH_TARGET.
      - name: Prepare patched core
        run: |
          $version = (Get-Content ../../package.json -Raw | ConvertFrom-Json).dependencies.'@oh-my-pi/pi-coding-agent'
          $core = Join-Path $env:RUNNER_TEMP 'core'
          New-Item -ItemType Directory -Path $core -Force | Out-Null
          Set-Content -Path (Join-Path $core 'package.json') -Value '{"name":"ci-core","private":true}'
          Push-Location $core
          bun add "@oh-my-pi/pi-coding-agent@$version"
          $installExit = $LASTEXITCODE
          Pop-Location
          if ($installExit -ne 0) { exit $installExit }
          $env:OMP_CORE_PATCH_TARGET = Join-Path $core 'node_modules/@oh-my-pi/pi-coding-agent'
          node patches/apply-core-patch.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OMP_CORE_PATCH_TARGET=$env:OMP_CORE_PATCH_TARGET" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Policy and generated agents
        run: |
          node patches/validate-harness-policy.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node patches/build-agents.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node patches/check-extension-duplicates.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Extension, guard and finalizer tests
        run: |
          bun test ./agent/extensions/tests ./agent/extensions/command-guard ./agent/tools/git-finalizer ./patches/content-scan.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # `bun test ./evals` would also pick up the graders' hidden task tests.
      - name: Eval analyzer tests
        run: |
          node --test (Get-ChildItem evals -Filter *.test.mjs).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Core patch regression tests
        run: |
          $failed = @()
          $tests = @(Get-ChildItem patches -Filter 'core-*-test.ts') + @(Get-Item patches/apply-core-patch-cli-test.ts)
          foreach ($test in $tests) {
            Write-Host "::group::$($test.Name)"
            bun run $test.FullName
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) { $failed += "$($test.Name) (exit $code)" }
          }
          if ($failed.Count -gt 0) { Write-Host "Failed: $($failed -join ', ')"; exit 1 }
