name: CI

# Verifies that the app installs from the committed bun.lock, type-checks, passes
# its tests and builds. `bun run test` covers the app only (not the private Tools/).
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    # CUELO runs on Windows PCs and the Windows desktop shell, and several tests
    # (run X-Ray session paths) assume Windows paths.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # engines.bun requires >=1.4.2: the omp SDK ships TypeScript that
          # imports `bun:` builtins, and Bun 1.4 changed loopback proxy handling.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Same as Tools/CUELO_Setup's build: an isolated home, because the build
      # otherwise walks the real profile and fails on protected folders (EPERM).
      - name: Build package
        shell: pwsh
        run: |
          $buildHome = Join-Path $env:RUNNER_TEMP 'build-home'
          New-Item -ItemType Directory -Path $buildHome -Force | Out-Null
          $root = [IO.Path]::GetPathRoot($buildHome)
          $env:USERPROFILE = $buildHome
          $env:HOME = $buildHome
          $env:HOMEDRIVE = $root.TrimEnd('\')
          $env:HOMEPATH = $buildHome.Substring($root.Length - 1)
          $env:NEXT_TELEMETRY_DISABLED = '1'
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
