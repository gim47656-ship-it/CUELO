name: CI

# Actions minutes are free only for the public mirror, so the heavy checks run
# there: `verify` and `verify-linux` (install, typecheck, lint, app tests,
# production build on Windows and on Linux, where both live PCs run CUELO under
# WSL), `harness` (extension, guard, finalizer and core patch tests) and
# `harness-linux` (the same harness tests on Linux, where the user-shell PTY
# path runs). CUELO-private
# is billed per minute (Windows at twice the Linux rate), so its `private` job
# (the checks that read files the mirror does not carry) runs only when started
# by hand (`workflow_dispatch`). The same checks run locally before a commit,
# and the setup transaction re-verifies the source manifest at deploy time.
# A build or test break shows up in the public CI right after the mirror is
# published, not on the private push.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    # Windows installs (PC-SETUP) still build here; `verify-linux` covers the
    # WSL runtime both live PCs use.
    if: github.repository == 'gim47656-ship-it/CUELO'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # engines.bun requires >=1.4.2: the omp SDK ships TypeScript that
          # imports `bun:` builtins, and Bun 1.4 changed loopback proxy handling.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile --backend=copyfile

      # The pristine SDK cannot be imported by typecheck, tests or the build; apply
      # its core patches to this checkout's own node_modules first.
      - name: Prepare source SDK
        run: bun run prepare:source

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # Side-chat sidecar against the real SDK: long answers survive stream, done and history.
      - name: Side chat sidecar test
        run: bun test ./Tools/CUELO_Setup/files/btw-server.test.mjs

      # Same as Tools/CUELO_Setup's build: an isolated home, because the build
      # otherwise walks the real profile and fails on protected folders (EPERM).
      - name: Build package
        shell: pwsh
        run: |
          $buildHome = Join-Path $env:RUNNER_TEMP 'build-home'
          New-Item -ItemType Directory -Path $buildHome -Force | Out-Null
          $root = [IO.Path]::GetPathRoot($buildHome)
          $env:USERPROFILE = $buildHome
          $env:HOME = $buildHome
          $env:HOMEDRIVE = $root.TrimEnd('\')
          $env:HOMEPATH = $buildHome.Substring($root.Length - 1)
          $env:NEXT_TELEMETRY_DISABLED = '1'
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply and verify web runtime compatibility
        shell: pwsh
        run: |
          node Tools/CUELO_Setup/files/native-runtime-patch.js --target .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node Tools/CUELO_Setup/files/native-runtime-patch.js --target . --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OMP_CORE_PATCH_TARGET = Join-Path $PWD 'node_modules/@oh-my-pi/pi-coding-agent'
          bun run Tools/CUELO_Setup/files/native-runtime-behavior-test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  verify-linux:
    name: Verify build (Linux)
    # Both live PCs run CUELO under WSL; install.mjs builds and patches there
    # with the same steps as below.
    if: github.repository == 'gim47656-ship-it/CUELO'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare source SDK
        run: bun run prepare:source

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Side chat sidecar test
        run: bun test ./Tools/CUELO_Setup/files/btw-server.test.mjs

      - name: Build package
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

      - name: Apply and verify web runtime compatibility
        run: |
          node Tools/CUELO_Setup/files/native-runtime-patch.js --target .
          node Tools/CUELO_Setup/files/native-runtime-patch.js --target . --check
          OMP_CORE_PATCH_TARGET="$PWD/node_modules/@oh-my-pi/pi-coding-agent" bun run Tools/CUELO_Setup/files/native-runtime-behavior-test.ts

  harness:
    name: Verify harness
    if: github.repository == 'gim47656-ship-it/CUELO'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Tools/OMP_Global_Config
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The runner's default TEMP is an 8.3 path (RUNNER~1). command-guard treats
      # any `~` in a `git -C` target as shell expansion and blocks it, which breaks
      # its repository-matching fixture. RUNNER_TEMP is a long path.
      - name: Use long-path TEMP
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile --backend=copyfile

      # Extension tests import the repository SDK as well as the patched copy below,
      # and the pristine SDK cannot be imported (ratchet/prelude.js), so patch it first.
      - name: Prepare source SDK
        working-directory: .
        run: bun run prepare:source

      # A fresh copy of the core version the app pins, patched in RUNNER_TEMP so
      # the core regression tests target a separate, freshly installed copy. Core and
      # extension tests read it through OMP_CORE_PATCH_TARGET.
      - name: Prepare patched core
        run: |
          $version = (Get-Content ../../package.json -Raw | ConvertFrom-Json).dependencies.'@oh-my-pi/pi-coding-agent'
          $core = Join-Path $env:RUNNER_TEMP 'core'
          New-Item -ItemType Directory -Path $core -Force | Out-Null
          Set-Content -Path (Join-Path $core 'package.json') -Value '{"name":"ci-core","private":true}'
          Push-Location $core
          bun add "@oh-my-pi/pi-coding-agent@$version"
          $installExit = $LASTEXITCODE
          Pop-Location
          if ($installExit -ne 0) { exit $installExit }
          $env:OMP_CORE_PATCH_TARGET = Join-Path $core 'node_modules/@oh-my-pi/pi-coding-agent'
          node patches/apply-core-patch.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OMP_CORE_PATCH_TARGET=$env:OMP_CORE_PATCH_TARGET" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Extension duplicate declarations
        run: |
          node patches/check-extension-duplicates.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Extension, guard, finalizer and skill-cost tests
        run: |
          bun test ./agent/extensions/tests ./agent/extensions/command-guard ./agent/tools/git-finalizer ./skill-cost
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Core patch regression tests
        run: |
          $failed = @()
          $tests = @(Get-ChildItem patches -Filter 'core-*-test.ts') + @(Get-Item patches/apply-core-patch-cli-test.ts)
          foreach ($test in $tests) {
            Write-Host "::group::$($test.Name)"
            bun run $test.FullName
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) { $failed += "$($test.Name) (exit $code)" }
          }
          if ($failed.Count -gt 0) { Write-Host "Failed: $($failed -join ', ')"; exit 1 }

  # Linux CUELO (WSL) takes paths Windows never does: the user-shell PTY used by
  # the `!` hotkey (core-patch-test.ts counts it only where it exists) and the
  # finalizer under pwsh. Same SDK preparation and tests as `harness`.
  harness-linux:
    name: Verify harness (Linux)
    if: github.repository == 'gim47656-ship-it/CUELO'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Tools/OMP_Global_Config
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Prepare source SDK
        working-directory: .
        run: bun run prepare:source

      - name: Prepare patched core
        run: |
          version=$(node -p "require('../../package.json').dependencies['@oh-my-pi/pi-coding-agent']")
          core="$RUNNER_TEMP/core"
          mkdir -p "$core"
          echo '{"name":"ci-core","private":true}' > "$core/package.json"
          (cd "$core" && bun add "@oh-my-pi/pi-coding-agent@$version")
          export OMP_CORE_PATCH_TARGET="$core/node_modules/@oh-my-pi/pi-coding-agent"
          node patches/apply-core-patch.mjs
          echo "OMP_CORE_PATCH_TARGET=$OMP_CORE_PATCH_TARGET" >> "$GITHUB_ENV"

      # Without bash the PTY check skips itself; the PTY itself comes from the
      # platform native package, and the finalizer tests run pwsh.
      - name: Check PTY and finalizer prerequisites
        run: |
          command -v bash
          command -v pwsh
          test -d "$RUNNER_TEMP/core/node_modules/@oh-my-pi/pi-natives-linux-x64" || { echo "pi-natives-linux-x64 is missing"; exit 1; }

      - name: Extension, guard, finalizer and skill-cost tests
        run: bun test ./agent/extensions/tests ./agent/extensions/command-guard ./agent/tools/git-finalizer ./skill-cost

      - name: Core patch regression tests
        run: |
          failed=()
          for test in patches/core-*-test.ts patches/apply-core-patch-cli-test.ts; do
            name=$(basename "$test")
            echo "::group::$name"
            bun run "$test" 2>&1 | tee "$RUNNER_TEMP/$name.log"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$code" -eq 0 ] || failed+=("$name (exit $code)")
          done
          # The user-shell PTY check must have run and passed here, not been skipped.
          grep -q "PASS  사용자 셸 PTY" "$RUNNER_TEMP/core-patch-test.ts.log" || failed+=("user-shell PTY check did not run")
          [ ${#failed[@]} -eq 0 ] || { echo "Failed: ${failed[*]}"; exit 1; }

  # The mirror has no agent/config.yml, models.yml, evals/, setup source manifest
  # or frozen review evidence. These checks use only Node/Bun built-ins, so there
  # is no `bun install`. content-scan.test.ts calls powershell.exe, hence Windows.
  private:
    name: Verify private files
    if: github.repository == 'gim47656-ship-it/CUELO-private' && github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Tools/OMP_Global_Config
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The setup transaction refuses to install when the app source differs from
      # files/source-integrity.json (git-tracked files, hashed with LF line endings).
      - name: Setup source manifest
        working-directory: Tools/CUELO_Setup
        run: |
          node files/source-build-helper.js verify-source ../.. files/source-integrity.json files/runtime-integrity.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Policy and generated agents
        run: |
          node patches/validate-harness-policy.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node patches/build-agents.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # content-scan.test.ts replays setup.ps1/verify.ps1 and synthetic .jsonl/.diff fixtures.
      - name: Content scan tests
        run: |
          bun test ./patches/content-scan.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # `bun test ./evals` would also pick up the graders' hidden task tests.
      - name: Eval analyzer tests
        run: |
          node --test (Get-ChildItem evals -Filter *.test.mjs).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
