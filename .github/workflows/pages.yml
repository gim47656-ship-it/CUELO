name: Publish CUELO introduction

# Publishing is an explicit action, not a side effect of a source push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cuelo-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'gim47656-ship-it/CUELO' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy introduction
        id: deployment
        uses: actions/deploy-pages@v4
