name: Publish CUELO introduction

# Publishing is an explicit action, not a side effect of a source push: a maintainer runs
# it by hand, or `release.yml` calls it right after it publishes a new version.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Released public main revision to publish"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cuelo-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'gim47656-ship-it/CUELO' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy introduction
        id: deployment
        uses: actions/deploy-pages@v5
