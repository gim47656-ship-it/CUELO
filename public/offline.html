<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- This page is precached by the service worker and served without the app
         bundle, so it cannot read @seed-design/css. The literals below are the
         resolved SEED values for each color mode: bg.layer-default (gray-00 /
         gray-100), fg.neutral (gray-1000), fg.neutral-muted (gray-800),
         bg.neutral-weak (gray-200 / gray-300) and stroke.neutral-muted. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16171b" />
    <title>CUELO is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
        background: #ffffff;
        color: #1a1c20;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #16171b;
          color: #f3f4f5;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #555d6d;
        font-size: 14px;
        line-height: 1.6;
      }

      button {
        margin-top: 24px;
        min-height: 40px;
        padding: 0 18px;
        border: 1px solid #00000010;
        border-radius: 8px;
        background: #f3f4f5;
        color: #1a1c20;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: #eeeff1;
      }

      button:focus-visible {
        outline: 2px solid #1a1c20;
        outline-offset: 3px;
      }

      @media (prefers-color-scheme: dark) {
        p {
          color: #dcdee3;
        }

        button {
          border-color: #ffffff17;
          background: #2b2e35;
          color: #f3f4f5;
        }

        button:hover {
          background: #393d46;
        }

        button:focus-visible {
          outline-color: #f3f4f5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>CUELO is offline</h1>
      <p>Reconnect to the local CUELO server, then try again.</p>
      <p id="offline-status" role="status" aria-live="polite">This page reopens the same address automatically when the server answers.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Served by the service worker in place of a failed navigation, so the
      // address bar still holds the original URL (session, query and hash).
      // Reload only when the server itself answers with its maintenance payload
      // and no update is draining; a failed fetch or any other body keeps waiting.
      (function () {
        var status = document.getElementById("offline-status");
        function check() {
          var controller = typeof AbortController === "function" ? new AbortController() : null;
          var timer = setTimeout(function () { if (controller) controller.abort(); }, 4000);
          fetch("/api/update-maintenance", { cache: "no-store", signal: controller ? controller.signal : undefined })
            .then(function (response) { return response.ok ? response.json() : null; })
            .then(function (body) {
              if (body && body.schemaVersion === 2 && body.mutationBlocked === false) {
                status.textContent = "The server is back. Reopening...";
                location.reload();
                return;
              }
              if (body && body.mutationBlocked === true) status.textContent = "CUELO is updating. This page reopens when the update finishes.";
              setTimeout(check, 3000);
            })
            .catch(function () { setTimeout(check, 3000); })
            .finally(function () { clearTimeout(timer); });
        }
        setTimeout(check, 3000);
      })();
    </script>
  </body>
</html>
