# Turnkey local deployment. See docs/docker.md for what each setting does.
#
#   CUELO_PASSWORD='a-long-random-password' \
#   OMP_UID=$(id -u) OMP_GID=$(id -g) docker compose up --build
#
# OMP_UID/OMP_GID rather than UID/GID because UID is readonly in bash and
# cannot be set inline.
services:
  cuelo:
    init: true
    build:
      context: .
      args:
        # Bind mounts keep host ownership; build the image for the user that
        # owns ~/.omp and the checkouts under CUELO_WORKSPACE.
        UID: ${OMP_UID:-1000}
        GID: ${OMP_GID:-1000}
    image: cuelo:local
    # Loopback only. CUELO can run a high-privilege agent, so read
    # docs/docker.md before publishing this on 0.0.0.0.
    ports:
      - "127.0.0.1:${CUELO_PORT:-30141}:30141"
    environment:
      CUELO_AUTHENTICATED: "1"
      CUELO_PASSWORD: ${CUELO_PASSWORD:?set CUELO_PASSWORD to the password the browser should ask for}
      CUELO_ALLOWED_HOSTS: ${CUELO_ALLOWED_HOSTS:-}
      CUELO_INSTANCE_LABEL: ${CUELO_INSTANCE_LABEL:-}
      CUELO_GITHUB_WORKSPACE: ${CUELO_GITHUB_WORKSPACE:-}
    volumes:
      # The same directory the omp CLI writes: sessions, config and model roles
      # are shared with the terminal.
      - ${OMP_HOME:-${HOME}/.omp}:/home/omp/.omp
      # The projects CUELO may open. Narrow this to the tree you want the
      # agent to reach.
      - ${CUELO_WORKSPACE:-.}:/workspace
      - ${CUELO_GH_CONFIG:-./.omp/cloud-gh}:/home/omp/.config/gh
    cpus: ${CUELO_CPU_LIMIT:-1.0}
    mem_limit: ${CUELO_MEMORY_LIMIT:-4g}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
